appId: com.android.chrome
---
#Upper Section test
- assertVisible: Image
- assertVisible: Student Home
- assertVisible: Logout
- assertVisible:
    id: navbar
#Test navbar togggle
- tapOn: Toggle navigation
- assertVisible:
    id: bs-example-navbar-collapse-1

- tapOn: Toggle navigation

# Check floating section with scrollUntilVisible for reliability
- scrollUntilVisible:
    element: "Transcript CGPA: 3.29"
    direction: DOWN
- assertVisible: "Completed Credit: 138"
# - assertVisible: "Current Balance: 0 Tk."

# Notice Section
- scrollUntilVisible:
    element: "Important Announcement"
    direction: DOWN
- assertVisible:
    id: "f_all_notice"
#Class Routine
- scrollUntilVisible:
    element:
      text: Class Routine
    direction: DOWN
# - assertVisible:
#     id: "ctl00_MainContainer_Class_Schedule"
# Profile Section - Standardized for better compatibility
- scrollUntilVisible:
    element: "Profile"
    direction: DOWN

# If it's still being covered by a header, add a tiny manual swipe
- scroll

- assertVisible:
    id: "ctl00_MainContainer_SI_Image"
- assertVisible: "011171060"

# Details Section
- scrollUntilVisible:
    element: "Father's Name"
    direction: DOWN
- assertVisible: "DOB"
- assertVisible: "Advisor Information"

# Charts - These often take time to render, so we use a small wait or specific ID
- scrollUntilVisible:
    element: "Attendance Summary"
    direction: DOWN
- waitForAnimationToEnd # Wait for the 'Interactive chart' to finish drawing
- assertVisible: "Interactive chart"
#Result Summary
- scrollUntilVisible:
    element: "Result Summary"
    direction: DOWN
- scroll
- assertVisible:
    text: View chart menu
    index: 1
# - scrollUntilVisible:
#     element: ctl00_A1
#     direction: UP

- repeat:
    times: 5
    commands:
      - swipe:
          start: 50%, 20%
          end: 50%, 80%
- tapOn: "Home"
